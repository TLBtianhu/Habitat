name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify runtime lock and SBOM
        run: node tools/verify-runtime-lock.mjs
      - name: Verify public snapshot
        run: node tools/verify-public-release.mjs
        env:
          HABITAT_CI: 1
      - name: Core agent and memory tests
        run: |
          node agent/verify-episode.mjs
          node agent/verify-memory-slice.mjs
          node agent/verify-residence-policy.mjs
          node agent/verify-residence-memory-store.mjs
          node agent/verify-after-action.mjs
          node agent/verify-action-tracking.mjs
          node agent/verify-event-pump.mjs
          node agent/verify-outbox.mjs
          node agent/verify-presence.mjs
      - name: Plugin and protocol tests
        run: |
          node adapters/verify-plugin-registry.mjs
          node adapters/verify-plugin-runtime.mjs
          node adapters/qq/verify-provider.mjs
          node clients/verify-onebot-supervisor.mjs
          node clients/verify-bilibili-supervisor.mjs
          node mcp/verify-mcp.mjs
      - name: Control and recovery tests
        run: |
          node control/verify-cross-channel.mjs
          node control/verify-cross-channel-http.mjs
          node control/verify-plugin-installer.mjs
          node control/verify-plugin-admin-http.mjs
          node control/verify-tasks.mjs
          node control/verify-outlet-supervisor.mjs
          node control/verify-outlet-resolver.mjs
          node control/verify-recovery.mjs
          node control/verify-recovery-http.mjs
      - name: Windows client lifecycle tests
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: powershell -NoProfile -File tools/win/verify-lifecycle.ps1
      - name: Skill and phase tests
        run: |
          node --test --test-force-exit runtime/skill-runtime.test.mjs
          node --test --test-force-exit director/phase-machine.test.mjs
      - name: Session and compositor tests
        run: |
          node agent/verify-session.mjs
          node desktop/verify-compositor.mjs
      - name: Build and verify distribution
        run: |
          node tools/package.mjs
          node tools/verify-distribution.mjs
      - name: Build Windows executables
        if: matrix.os == 'windows-latest'
        run: |
          node tools/build-win-exe.mjs
          node tools/verify-win-release.mjs
      - name: Cache Setup runtime archive
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\habitat-runtime-cache\runtime.tar.gz
          key: habitat-runtime-${{ hashFiles('runtime/lock.json') }}
      - name: Seed Setup runtime archive
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          wsl bash -lc "mkdir -p /mnt/c/habitat-runtime-cache && if [ ! -f /mnt/c/habitat-runtime-cache/runtime.tar.gz ]; then curl -L --fail --retry 3 -o /mnt/c/habitat-runtime-cache/runtime.tar.gz 'https://www.modelscope.cn/datasets/TLBtianhu/Habitat-Dist/resolve/master/runtime/habitat-runtime-core-0.1.0.tar.gz'; fi && cp /mnt/c/habitat-runtime-cache/runtime.tar.gz /tmp/habitat-runtime-core.tar.gz"
      - name: Setup EXE acceptance
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: powershell -NoProfile -File tools/win/verify-setup.ps1
      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: habitat-windows-installer
          path: dist/win
          if-no-files-found: error
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: habitat-portable-${{ matrix.os }}
          path: dist/fishbowl-v0.1.zip
          if-no-files-found: error

  runtime-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache runtime archive
        uses: actions/cache@v4
        with:
          path: /tmp/habitat-runtime-cache/runtime.tar.gz
          key: habitat-runtime-${{ hashFiles('runtime/lock.json') }}
      - name: Download runtime archive if needed
        run: |
          mkdir -p /tmp/habitat-runtime-cache
          if [ ! -f /tmp/habitat-runtime-cache/runtime.tar.gz ]; then
            curl -L --fail --retry 3 -o /tmp/habitat-runtime-cache/runtime.tar.gz "https://www.modelscope.cn/datasets/TLBtianhu/Habitat-Dist/resolve/master/runtime/habitat-runtime-core-0.1.0.tar.gz"
          fi
      - name: Install runtime from lockfile
        run: node tools/fetch-runtime.mjs /tmp/habitat-portable-runtime
        env:
          HABITAT_RUNTIME_ARCHIVE: /tmp/habitat-runtime-cache/runtime.tar.gz
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build portable app
        run: node tools/package.mjs
      - name: Verify clean portable installation
        run: |
          rm -rf /tmp/habitat-portable
          mkdir -p /tmp/habitat-portable
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/fishbowl-v0.1.zip') as z:
              z.extractall('/tmp/habitat-portable')
          PY
          mv /tmp/habitat-portable/Fishbowl /tmp/habitat-portable/app
          cp -a /tmp/habitat-portable-runtime /tmp/habitat-portable/runtime
          node tools/verify-portable.mjs /tmp/habitat-portable
