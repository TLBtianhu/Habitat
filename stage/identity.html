<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Habitat · 身份中心</title>
<style>
  body { margin:0; background:#0b0d12; color:#cfd8ef; font-family:system-ui,"Microsoft YaHei",sans-serif; }
  #wrap { width:1280px; margin:0 auto; padding:34px 42px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .sub { color:#6b7897; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .card { background:#10151f; border:1px solid #223047; border-radius:16px; padding:20px; }
  .card h2 { font-size:17px; margin:0 0 8px; }
  .meta { font-size:12px; color:#6b7897; margin-bottom:12px; }
  .status { display:inline-block; font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid #2d6a3f; color:#7ee787; }
  .status.unbound { color:#ffb454; border-color:#8a5a1a; }
  button { background:#1b6fd0; color:white; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; margin-right:6px; }
  button.secondary { background:#263247; }
  input { width:100%; box-sizing:border-box; background:#0a0f17; color:#dbe6ff; border:1px solid #2a3a56; border-radius:8px; padding:8px; margin:6px 0 10px; }
  .row { margin-top:14px; }
  pre { white-space:pre-wrap; color:#8fa3c8; font-size:11px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Identity Hub</h1>
  <div class="sub">客户端只声明身份需求；绑定、测试、注销统一在这里。</div>
  <div id="grid" class="grid"></div>
</div>
<script>
const HUB = 'http://127.0.0.1:9237';
const post = (p, body) => fetch(HUB + p, {
  method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)
}).then(r => r.json());

async function render() {
  const manifests = await (await fetch(HUB + '/identity/manifests')).json();
  const records = await (await fetch(HUB + '/identity/list')).json();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const m of manifests) {
    const rec = records.find(r => r.identityId === m.secretRef && r.status === 'bound');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h2>${m.displayName}</h2>
      <div class="meta">${m.client}/${m.provider} · ${m.loginFlow}</div>
      <div class="status ${rec ? '' : 'unbound'}">${rec ? '已绑定 · ' + rec.displayName : '未绑定'}</div>
      <div class="meta" style="margin-top:10px">权限：${m.scopes.join('、')}</div>
      <div class="form"></div>
      <div class="row">
        <button class="bind">${rec ? '重绑' : '绑定'}</button>
        ${rec ? '<button class="secondary test">测试</button><button class="secondary revoke">注销</button>' : ''}
      </div>
      <pre class="out"></pre>`;
    const form = card.querySelector('.form');
    for (const f of m.fields || []) {
      const input = document.createElement('input');
      input.placeholder = f.label + (f.required ? '（必填）' : '');
      input.type = f.type === 'secret' ? 'password' : 'text';
      input.dataset.key = f.key;
      form.appendChild(input);
    }
    card.querySelector('.bind').onclick = async () => {
      const fields = {};
      form.querySelectorAll('input').forEach(i => fields[i.dataset.key] = i.value);
      const b = await post('/identity/begin', { client: m.client, provider: m.provider });
      if (b.flow === 'qrcode') {
        const out = card.querySelector('.out');
        out.innerHTML = `<div style="text-align:center"><img src="${b.qrDataUrl || b.url}" style="width:180px;height:180px;background:white;padding:8px;border-radius:8px"><div style="margin-top:8px;color:#94a3b8">${b.instruction || '请扫码确认'}</div></div>`;
        const timer = setInterval(async () => {
          const r = await post('/identity/poll', { bindingId: b.bindingId });
          if (r.status === 'bound') {
            clearInterval(timer);
            out.textContent = '已绑定';
            setTimeout(render, 500);
          } else if (r.status === 'expired' || r.status === 'error') {
            clearInterval(timer);
            out.textContent = r.message || '二维码已过期，请重新生成';
          }
        }, 1500);
        return;
      }
      const out = await post('/identity/complete', { bindingId: b.bindingId, fields });
      card.querySelector('.out').textContent = JSON.stringify(out, null, 2);
      setTimeout(render, 500);
    };
    if (rec) {
      card.querySelector('.test').onclick = async () => {
        card.querySelector('.out').textContent = JSON.stringify(await post('/identity/test', { identityId: m.secretRef }), null, 2);
      };
      card.querySelector('.revoke').onclick = async () => {
        await post('/identity/revoke', { identityId: m.secretRef });
        setTimeout(render, 300);
      };
    }
    grid.appendChild(card);
  }
}
render();
if (new URLSearchParams(location.search).get('demo') === '1') {
  setTimeout(() => document.querySelector('.bind')?.click(), 500);
}
</script>
</body>
</html>
