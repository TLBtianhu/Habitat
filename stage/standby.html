<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Fishbowl Standby</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; }
  body { font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #cfd8ef; }
  #wrap { position: relative; width: 1280px; height: 720px;
    background: radial-gradient(circle at 50% 40%, #141d30 0%, #0a0f18 55%, #07090d 100%); }
  #card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; padding: 42px 64px; border-radius: 22px;
    background: rgba(12, 18, 30, .72); border: 1px solid rgba(110, 168, 255, .18);
    box-shadow: 0 24px 80px rgba(0,0,0,.55); }
  #card b { display: block; font-size: 40px; margin-bottom: 14px; color: #ffb454; }
  #card span { font-size: 19px; color: #6b7897; }
  #brand { position: absolute; right: 40px; top: 26px; font-size: 13px; color: #55627e; letter-spacing: 2px; }
  #ai { position: absolute; right: 40px; bottom: 26px; font-size: 12px; color: #4d5a76;
    border: 1px solid rgba(110,168,255,.16); padding: 4px 9px; border-radius: 6px; }
  #dot { position: absolute; left: 40px; top: 26px; font-size: 13px; color: #6b7897; }
  #dot i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff5c6c; margin-right: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="dot"><i></i>连接中断</div>
  <div id="brand">FISHBOWL</div>
  <div id="card">
    <b>她那边有点事</b>
    <span>正在重连，请稍等一下</span>
  </div>
  <div id="ai">AI 生成内容 · 非真人</div>
</div>
</body>
</html>
